# Default detectors apply to every source, test and document.
# Exceptions match BOTH one reviewed file path AND an exact synthetic value
# or non-secret identifier. No directory, Markdown or test-wide exclusion.
# The config may repeat those exact values as escaped regex literals.
# Review additions individually; never generate exceptions from an unreviewed scan.
# targetRules is required: in Gitleaks 8.30.1 directory mode, global path
# allowlists can skip a file before their regex condition is evaluated.
# Rule-scoped exceptions keep new credentials in the same file detectable.
# See docs/SECRET_SCANNING.md and scripts/test_gitleaks_policy.py.
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic detector input, test data or laboratory example in demo/README.md"
condition = "AND"
regexTarget = "secret"
paths = ["\\Ademo/README\\.md\\z", "\\A\\.gitleaks\\.toml\\z"]
regexes = [
  "\\AdisableTls=true\\z",
]

[[allowlists]]
targetRules = ["slack-webhook-url", "stripe-access-token"]
description = "Synthetic detector input, test data or laboratory example in demo/vulnerable-app/assets/config.properties"
condition = "AND"
regexTarget = "secret"
paths = ["\\Ademo/vulnerable\\-app/assets/config\\.properties\\z", "\\A\\.gitleaks\\.toml\\z"]
regexes = [
  "\\Ahttps://hooks\\.slack\\.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX\\z",
  "\\Ask_live_4eC39HqLyjWDarjtT1zdp7dcEXAMPLE0000\\z",
]

