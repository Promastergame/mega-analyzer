name: Core release checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  repository:
    name: Documentation and bundled tool integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/check_docs.py
      - run: python scripts/check_bundled_tools.py
      - run: python -m unittest discover -s scripts -p 'test_publication.py'
      - run: python -m unittest discover -s scripts -p 'test_compare_reports.py'
      - run: python -m unittest discover -s scripts -p 'test_remote_frida.py'
      - name: Web UI logic regressions
        run: |
          node scripts/test-workspace-ui.cjs
          node scripts/test-scan-ui.cjs
          node scripts/test-vmware-ui.cjs
          node scripts/test-android-screen.cjs
          node scripts/test-vmware-screen.cjs

  public-source:
    name: Build the public source export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: python scripts/public_source.py --output dist/public-source
      - run: python scripts/public_source.py --verify dist/public-source
      - name: Check documentation and tools in the exported tree
        working-directory: dist/public-source
        run: |
          python scripts/check_docs.py
          python scripts/check_bundled_tools.py
      - name: Build without private files or Git history
        working-directory: dist/public-source
        env:
          CGO_ENABLED: '0'
        run: go build -buildvcs=false ./pkg/cmd/analyzer ./cmd/decompiler

  docker:
    name: Docker on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/docker_smoke.py

  tests:
    name: Go tests, race detector and detection quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: Crypto instrumentation and sandbox report UI
        run: node scripts/test-sandbox-crypto.cjs
      - name: Detection quality
        run: go run ./cmd/eval -min-precision 1 -min-recall 1 -rule-thresholds testdata/eval/thresholds.json > eval-report.json
      - name: Tests and coverage for this commit
        run: |
          if ! go test -race -timeout 30m -coverprofile=coverage.out -json ./... > go-tests.json; then
            echo "::error::go test failed. Failure details from go-tests.json:"
            python -c "
          import json, sys
          failed = []
          try:
              with open('go-tests.json', 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      try:
                          evt = json.loads(line)
                          if evt.get('Action') == 'output':
                              out = evt.get('Output', '')
                              if any(k in out for k in ('FAIL:', 'DATA RACE', 'panic:', '--- FAIL')):
                                  sys.stdout.write(out)
                          elif evt.get('Action') == 'fail' and evt.get('Test'):
                              failed.append((evt.get('Package', ''), evt.get('Test', '')))
                      except Exception:
                          pass
          except Exception as e:
              print(f'Error reading go-tests.json: {e}')
          if failed:
              print('\n--- FAILED TESTS ---')
              for pkg, test in failed:
                  print(f'FAIL: {pkg} {test}')
          " || true
            exit 1
          fi
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"; fi
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz smoke
        run: |
          for target in FuzzAXMLDecode FuzzParseARSC FuzzHermes FuzzParseDEXBytes; do
            go test -run "^${target}$" -fuzz "^${target}$" -fuzztime 15s ./pkg/internal/apkloader/ || exit 1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: core-test-evidence
          path: |
            eval-report.json
            go-tests.json
            coverage.out

  smoke:
    name: Packaged core on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep ubuntu-latest (1x minute multiplier).
        # windows-latest (2x) and macos-latest (10x) disabled to avoid burning GitHub minutes quota.
        runner: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python scripts/release.py build --output dist/smoke
      - run: python scripts/release.py verify --output dist/smoke
      - name: Standalone decompiler without bundled tools
        env:
          CGO_ENABLED: '0'
        run: go test -tags noembed ./pkg/decompiler ./cmd/decompiler
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: smoke-evidence-${{ matrix.runner }}
          path: |
            dist/smoke/*.log
            dist/smoke/verification.json
