# Binary parsing: ELF/PE are parsed by the in-house `elfparse`/`peparse`
# modules; DWARF was dropped (debugger resolves via loader symtabs).
# No binary-format third-party crates remain — see NOTICE.txt.

# Disassembly
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "gas", "nasm", "masm", "instr_info"] }
# NOTE: ARM64 uses the dependency-free in-house `omnisec-arm64-decode` crate.

# Network instrumentation: fully in-house (blocking std sockets + threads).
# No async runtime remains — see NOTICE.txt.

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Must stay "unwind": every cdylib/staticlib here is loaded into the Go
# analyzer process, and a panic escaping an `extern "C"` boundary must be
# contained by `omnisec_core::ffi_guard::catch_panic` at the call site, not
# abort the whole process. CLI-only binaries can still opt into
# `-C panic=abort` at build time.
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
debug = true

# Workspace-wide lints (applied via [lints] in each crate)
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
unused_must_use = "deny"
dead_code = "warn"
unused_assignments = "warn"

[workspace.lints.clippy]
# `pedantic` only — `nursery` + `cargo` produce hundreds of low-signal
# notes during the early-phase build-out and we'll re-enable them once
# the surface stabilises.
pedantic = { level = "warn", priority = -1 }
# Reasonable opt-outs for ergonomics.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
# Brand acronyms (OmniSec, OmniIR, JVM, ...) trip `doc_markdown`'s heuristic.
doc_markdown = "allow"
# We carry rich `Debug` plus `Display` on most types — overlap is fine.
needless_pass_by_value = "allow"
# Many of our enums are conceptually flat, even when one variant holds data.
result_large_err = "allow"
# Format parsers and lifters routinely cast between widths and signedness
# in well-defined ways — flagging every such cast adds noise without
# catching real bugs.
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
should_implement_trait = "allow"
result_unit_err = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
assigning_clones = "allow"
manual_let_else = "allow"
not_unsafe_ptr_arg_deref = "allow"
format_push_string = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
unused_self = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
many_single_char_names = "allow"
doc_link_with_quotes = "allow"
too_many_arguments = "allow"
unnecessary_map_or = "allow"
match_wildcard_for_single_variants = "allow"
unnecessary_wraps = "allow"
pub_underscore_fields = "allow"
return_self_not_must_use = "allow"
# We use `format!` for short strings frequently; inline formatting loses
# clarity in many cases.
uninlined_format_args = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
manual_checked_ops = "allow"
unnecessary_literal_bound = "allow"
manual_is_multiple_of = "allow"
default_constructed_unit_structs = "allow"

items_after_statements = "allow"

single_match_else = "allow"
useless_vec = "allow"
unused_format_specs = "allow"

# Zero-dep fork of iced-x86 (lazy_static -> std LazyLock, see
# third-party/iced-x86/README.md). Applies to all workspace members.
[patch.crates-io]
iced-x86 = { path = "../third-party/iced-x86" }
